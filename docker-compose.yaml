services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=broken_cloud_news_agent_db
      - POSTGRES_PASSWORD=cloud_security_agent
      - POSTGRES_DB=broken_cloud_news
    volumes:
      - broken_cloud_news_db:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U broken_cloud_news_agent_db -d broken_cloud_news"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_internal

  egress_proxy:
    image: sameersbn/squid:3.5.27-2
    restart: always
    volumes:
      - ./infra/squid/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - app_internal
      - egress_public

  bcn:
    build: .
    restart: always
    command: run
    env_file: .env
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-http://egress_proxy:3128}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://egress_proxy:3128}
      - BCN_PLAYWRIGHT_PROXY=${BCN_PLAYWRIGHT_PROXY:-http://egress_proxy:3128}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,postgres,comfy,comfyui}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,::1,postgres,comfy,comfyui}
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
      - "9004:9004"
      - "9005:9005"
      - "9006:9006"
    depends_on:
      postgres:
        condition: service_healthy
      egress_proxy:
        condition: service_started
    networks:
      - app_internal

networks:
  app_internal:
    driver: bridge
    internal: true
  egress_public:
    driver: bridge

volumes:
  broken_cloud_news_db:
