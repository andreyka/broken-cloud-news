x-bcn-base: &bcn-base
  build: .
  restart: always
  env_file: .env
  environment:
    - HTTP_PROXY=${HTTP_PROXY:-http://egress_proxy:3128}
    - HTTPS_PROXY=${HTTPS_PROXY:-http://egress_proxy:3128}
    - BCN_PLAYWRIGHT_PROXY=${BCN_PLAYWRIGHT_PROXY:-http://egress_proxy:3128}
    - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,postgres,comfy,comfyui},spark_bridge
    - no_proxy=${NO_PROXY:-localhost,127.0.0.1,::1,postgres,comfy,comfyui},spark_bridge
  dns:
    - 172.29.0.53
  depends_on:
    postgres:
      condition: service_healthy
    egress_proxy:
      condition: service_started
    dns_resolver:
      condition: service_started
    spark_bridge:
      condition: service_started
  networks:
    - app_internal

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${BCN_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${BCN_POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${BCN_POSTGRES_DB:-broken_cloud_news}
    volumes:
      - broken_cloud_news_db:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${BCN_POSTGRES_USER:-postgres} -d ${BCN_POSTGRES_DB:-broken_cloud_news}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_internal

  egress_proxy:
    image: sameersbn/squid:3.5.27-2
    restart: always
    volumes:
      - ./infra/squid/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - app_internal
      - egress_public

  dns_resolver:
    image: coredns/coredns:1.11.1
    restart: always
    command: -conf /etc/coredns/Corefile
    volumes:
      - ./infra/coredns/Corefile:/etc/coredns/Corefile:ro
    networks:
      app_internal:
        ipv4_address: 172.29.0.53
      egress_public:

  spark_bridge:
    image: nginx:1.27-alpine
    restart: always
    environment:
      - SPARK_BRIDGE_UPSTREAM=${SPARK_BRIDGE_UPSTREAM:-http://host.docker.internal:8000}
    volumes:
      - ./infra/nginx/spark_bridge.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_internal
      - egress_public

  scheduler:
    <<: *bcn-base
    command: scheduler

  bcn:
    <<: *bcn-base
    command: worker --lane publish

  ingest_worker:
    <<: *bcn-base
    command: worker --lane collection --lane analysis

  evaluation_worker:
    <<: *bcn-base
    command: worker --lane evaluation

  dashboard:
    build: ./dashboard
    restart: always
    env_file: .env
    environment:
      - DATABASE_URL=${DASHBOARD_DATABASE_URL:-${BCN_DATABASE_URL:-}}
      - HOSTNAME=0.0.0.0
      - PORT=3000
    ports:
      - "3007:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_internal
      - egress_public

networks:
  app_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  egress_public:
    driver: bridge

volumes:
  broken_cloud_news_db:
