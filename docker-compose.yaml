services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=broken_cloud_news_agent_db
      - POSTGRES_PASSWORD=cloud_security_agent
      - POSTGRES_DB=broken_cloud_news
    volumes:
      - broken_cloud_news_db:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broken_cloud_news_agent_db -d broken_cloud_news"]
      interval: 5s
      timeout: 5s
      retries: 5

  browserless:
    image: ghcr.io/browserless/chromium:latest
    restart: always
    environment:
      - TIMEOUT=60000
      - CONCURRENT=5
      - QUEUED=10
      - HEALTH=true
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/json/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  bcn:
    build: .
    restart: always
    command: run
    env_file: .env
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
      - "9004:9004"
    depends_on:
      postgres:
        condition: service_healthy
      browserless:
        condition: service_healthy

volumes:
  broken_cloud_news_db:
