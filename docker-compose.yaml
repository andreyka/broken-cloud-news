services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres_agent_db
      - POSTGRES_PASSWORD=cloud_security_agent
      - POSTGRES_DB=broken_cloud_news
    volumes:
      - broken_cloud_news_db:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres_agent_db -d broken_cloud_news"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_internal

  egress_proxy:
    image: sameersbn/squid:3.5.27-2
    restart: always
    volumes:
      - ./infra/squid/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - app_internal
      - egress_public

  dns_resolver:
    image: coredns/coredns:1.11.1
    restart: always
    command: -conf /etc/coredns/Corefile
    volumes:
      - ./infra/coredns/Corefile:/etc/coredns/Corefile:ro
    networks:
      app_internal:
        ipv4_address: 172.29.0.53
      egress_public:

  spark_bridge:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ./infra/nginx/spark_bridge.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_internal
      - egress_public

  bcn:
    build: .
    restart: always
    command: run
    env_file: .env
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-http://egress_proxy:3128}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://egress_proxy:3128}
      - BCN_PLAYWRIGHT_PROXY=${BCN_PLAYWRIGHT_PROXY:-http://egress_proxy:3128}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,postgres,comfy,comfyui,spark_bridge}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,::1,postgres,comfy,comfyui,spark_bridge}
    dns:
      - 172.29.0.53
    ports:
      - "9001:9001"
      - "9002:9002"
      - "9003:9003"
      - "9004:9004"
      - "9005:9005"
      - "9006:9006"
    depends_on:
      postgres:
        condition: service_healthy
      egress_proxy:
        condition: service_started
      dns_resolver:
        condition: service_started
      spark_bridge:
        condition: service_started
    networks:
      - app_internal

  dashboard:
    build: ./dashboard
    restart: always
    environment:
      - DATABASE_URL=${DASHBOARD_DATABASE_URL:-postgresql://broken_cloud_news_agent_db:cloud_security_agent@postgres:5432/broken_cloud_news}
      - HOSTNAME=0.0.0.0
      - PORT=3000
    ports:
      - "3007:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_internal
      - egress_public

networks:
  app_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  egress_public:
    driver: bridge

volumes:
  broken_cloud_news_db:
