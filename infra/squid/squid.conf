# Minimal egress policy for BCN runtime traffic.

http_port 3128

# Destination controls: deny localhost, RFC1918, link-local, and metadata.
acl denied_dst dst 127.0.0.0/8 ::1
acl denied_dst dst 10.0.0.0/8
acl denied_dst dst 172.16.0.0/12
acl denied_dst dst 192.168.0.0/16
acl denied_dst dst 169.254.0.0/16
acl denied_dst dst fc00::/7
acl denied_dst dst fe80::/10
acl denied_dst dst 100.100.100.200/32
acl denied_dst dst 169.254.169.254/32
acl denied_dst dst 169.254.170.2/32

# Allow proxy access from Docker bridge ranges only.
acl docker_clients src 10.0.0.0/8
acl docker_clients src 172.16.0.0/12
acl docker_clients src 192.168.0.0/16

# Method/port safety baseline.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 8080
acl Safe_ports port 8443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny denied_dst
http_access allow docker_clients
http_access deny all

dns_v4_first on
