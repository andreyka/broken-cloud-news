server {
    listen 8000;
    server_name _;

    location / {
        proxy_pass http://192.168.0.9:8000;
        proxy_http_version 1.1;
        proxy_set_header Host 192.168.0.9:8000;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
