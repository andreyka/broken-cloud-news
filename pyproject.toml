[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "broken-cloud-news"
version = "2.0.0"
description = "Cloud security briefing agent with A2A protocol"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=0.2.0",
    "httpx>=0.27",
    "beautifulsoup4[lxml]>=4.12",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.1",
    "apscheduler>=4.0",
    "feedparser>=6.0",
    "python-telegram-bot>=21.0",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]
dev = ["pytest", "pytest-asyncio", "respx"]

[project.scripts]
bcn = "bcn.cli:cli"
