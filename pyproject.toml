[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "broken-cloud-news"
version = "2.0.0"
description = "Cloud security briefing microservices"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.1",
    "apscheduler>=4.0.0a5",
    "feedparser>=6.0",
    "python-telegram-bot>=21.0",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "playwright>=1.49",
    "google-genai>=0.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[tool.hatch.build.targets.wheel]
packages = ["bcn"]

[project.scripts]
bcn = "bcn.cli:cli"
